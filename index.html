<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Burgergram</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #0a0a0a; color: #e0e0e0; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 8px; }
        #app { width: 100%; max-width: 1200px; height: 95vh; max-height: 800px; background: #1a1a2e; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.8); display: flex; flex-direction: column; overflow: hidden; }
        
        #auth-screen { display: flex; flex: 1; justify-content: center; align-items: center; background: #1a1a2e; padding: 16px; }
        .auth-card { background: #16213e; border-radius: 24px; padding: 28px 24px; width: 100%; max-width: 360px; border: 1px solid #2a3a5e; }
        .auth-card h2 { font-weight: 700; font-size: 24px; margin-bottom: 4px; color: #fff; }
        .auth-card h2 .burger-icon { color: #f5a623; }
        .auth-card p.sub { color: #8899bb; font-size: 13px; margin-bottom: 20px; }
        .auth-card label { display: block; font-size: 12px; font-weight: 500; color: #8899bb; margin: 10px 0 4px 4px; }
        .auth-card input { width: 100%; padding: 10px 14px; background: #0d1b2a; border: 1px solid #2a3a5e; border-radius: 12px; color: #f0f4fa; font-size: 14px; outline: none; transition: 0.2s; }
        .auth-card input:focus { border-color: #4f8cf7; box-shadow: 0 0 0 3px rgba(79,140,247,0.2); }
        .auth-card .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
        .btn-primary { background: #4f8cf7; border: none; padding: 10px; border-radius: 12px; font-weight: 600; color: #fff; font-size: 14px; cursor: pointer; transition: 0.15s; }
        .btn-primary:hover { background: #3a73e0; transform: scale(0.98); }
        .btn-outline { background: transparent; border: 1px solid #2a3a5e; padding: 10px; border-radius: 12px; font-weight: 500; color: #8899bb; cursor: pointer; transition: 0.15s; }
        .btn-outline:hover { background: #1a2a4e; border-color: #4f8cf7; }
        .auth-error { background: #3d1e2a; color: #f79cb0; padding: 8px 12px; border-radius: 10px; font-size: 12px; margin-top: 10px; text-align: center; border-left: 3px solid #e4566a; }
        .auth-success { background: #1a3a2a; color: #7ddfa0; padding: 8px 12px; border-radius: 10px; font-size: 12px; margin-top: 10px; text-align: center; border-left: 3px solid #4ade80; }
        
        #main-screen { display: none; flex: 1; height: 100%; }
        .messenger-layout { display: flex; height: 100%; width: 100%; }
        
        .sidebar { width: 280px; background: #16213e; border-right: 1px solid #2a3a5e; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 12px 14px; border-bottom: 1px solid #2a3a5e; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px; }
        .sidebar-header h3 { font-weight: 700; font-size: 17px; color: #fff; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .sidebar-header h3 i { color: #f5a623; }
        .sidebar-header h3:hover { opacity: 0.8; }
        .sidebar-header .user-badge { background: #1a2a4e; padding: 4px 8px 4px 6px; border-radius: 10px; font-size: 11px; display: flex; align-items: center; gap: 4px; color: #c8d4e6; cursor: pointer; transition: 0.15s; border: 1px solid transparent; }
        .sidebar-header .user-badge:hover { border-color: #4f8cf7; }
        .logout-btn { background: none; border: none; color: #8899bb; font-size: 15px; cursor: pointer; padding: 4px 6px; border-radius: 10px; transition: 0.15s; }
        .logout-btn:hover { background: #1a2a4e; color: #f0f4fa; }
        
        .chat-tabs { display: flex; border-bottom: 1px solid #2a3a5e; background: #0d1b2a; }
        .chat-tabs button { flex: 1; padding: 8px 4px; background: none; border: none; color: #8899bb; font-size: 12px; cursor: pointer; transition: 0.15s; border-bottom: 2px solid transparent; font-weight: 500; }
        .chat-tabs button.active { color: #4f8cf7; border-bottom-color: #4f8cf7; }
        .chat-tabs button:hover { background: #1a2a4e; }
        
        .contact-list { flex: 1; overflow-y: auto; padding: 4px 0; }
        .contact-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer; transition: 0.1s; border-left: 3px solid transparent; }
        .contact-item:hover { background: #1a2a4e; }
        .contact-item.active { background: #1a2a4e; border-left-color: #4f8cf7; }
        .contact-item .unread-badge { background: #4f8cf7; color: #fff; border-radius: 50%; padding: 1px 6px; font-size: 10px; margin-left: auto; min-width: 18px; text-align: center; }
        .contact-avatar { width: 38px; height: 38px; border-radius: 50%; background: #2a3a5e; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #b8ccf0; text-transform: uppercase; font-size: 15px; flex-shrink: 0; position: relative; overflow: hidden; }
        .contact-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .contact-avatar .status-dot { position: absolute; bottom: 1px; right: 1px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid #16213e; }
        .contact-avatar .status-dot.online { background: #4ade80; }
        .contact-avatar .status-dot.offline { background: #666; }
        .contact-avatar .status-dot.typing { background: #f5a623; animation: pulse 1s infinite; }
        .contact-avatar .vip-badge { position: absolute; top: -2px; right: -2px; background: #f5a623; color: #1a1a2e; border-radius: 50%; width: 16px; height: 16px; font-size: 8px; display: flex; align-items: center; justify-content: center; border: 2px solid #16213e; font-weight: 700; }
        .contact-avatar .crown-badge { position: absolute; top: -2px; left: -2px; color: #f5a623; font-size: 12px; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
        .contact-info { flex: 1; overflow: hidden; min-width: 0; }
        .contact-name { font-weight: 500; color: #e8edf5; display: flex; align-items: center; gap: 4px; font-size: 14px; flex-wrap: wrap; }
        .contact-name .verified-icon { color: #4ade80; font-size: 11px; }
        .contact-name .vip-icon { color: #f5a623; font-size: 11px; font-weight: 700; }
        .contact-name .crown-icon { color: #f5a623; font-size: 12px; }
        .contact-name .chat-type-badge { font-size: 9px; background: #2a3a5e; padding: 1px 6px; border-radius: 8px; color: #8899bb; }
        .contact-lastmsg { font-size: 12px; color: #8899bb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .contact-time { font-size: 10px; color: #667799; margin-left: auto; flex-shrink: 0; }
        
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #0d1b2a; min-width: 0; }
        .chat-header { padding: 10px 14px; background: #16213e; border-bottom: 1px solid #2a3a5e; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .chat-header .chat-partner { font-weight: 500; font-size: 15px; color: #eef3fa; display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; flex-wrap: wrap; }
        .chat-header .chat-partner .status-text { font-size: 11px; color: #8899bb; font-weight: 400; }
        .chat-header .chat-actions { display: flex; gap: 3px; flex-shrink: 0; }
        .chat-header .chat-actions button { background: none; border: none; color: #8899bb; cursor: pointer; padding: 4px 6px; border-radius: 8px; transition: 0.15s; font-size: 13px; }
        .chat-header .chat-actions button:hover { background: #1a2a4e; color: #f0f4fa; }
        .chat-header .typing-status { font-size: 11px; color: #f5a623; width: 100%; order: 3; margin-top: 2px; min-height: 16px; }
        
        .messages-container { flex: 1; overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; }
        .message-wrapper { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
        .message-wrapper.own { flex-direction: row-reverse; }
        .message-wrapper .msg-avatar { width: 32px; height: 32px; border-radius: 50%; background: #2a3a5e; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #b8ccf0; font-size: 13px; flex-shrink: 0; overflow: hidden; position: relative; }
        .message-wrapper .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .message-wrapper .msg-avatar .vip-badge { position: absolute; bottom: -2px; right: -2px; background: #f5a623; color: #1a1a2e; border-radius: 50%; width: 14px; height: 14px; font-size: 7px; display: flex; align-items: center; justify-content: center; border: 2px solid #0d1b2a; font-weight: 700; }
        .message-wrapper .msg-avatar .crown-badge { position: absolute; top: -2px; left: -2px; color: #f5a623; font-size: 10px; }
        .message-wrapper .msg-content { max-width: 70%; display: flex; flex-direction: column; }
        .message-wrapper .msg-content .msg-sender { font-size: 11px; font-weight: 600; color: #8899bb; margin-bottom: 2px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
        .message-wrapper.own .msg-content .msg-sender { color: #b6ceff; text-align: right; justify-content: flex-end; }
        .message-wrapper .msg-content .msg-sender .vip-icon { color: #f5a623; font-size: 10px; font-weight: 700; }
        .message-wrapper .msg-content .msg-sender .crown-icon { color: #f5a623; font-size: 11px; }
        .message-wrapper .msg-content .msg-sender .verified-icon { color: #4ade80; font-size: 10px; }
        .message { padding: 8px 12px; border-radius: 14px; font-size: 14px; line-height: 1.4; word-wrap: break-word; background: #1a2a4e; color: #e3eaf3; align-self: flex-start; position: relative; }
        .message-wrapper.own .message { background: #4f8cf7; color: #fff; }
        .message .msg-time { font-size: 9px; opacity: 0.6; margin-top: 2px; text-align: right; }
        .message .msg-actions { position: absolute; top: 2px; right: 4px; display: none; gap: 2px; }
        .message:hover .msg-actions { display: flex; }
        .message .msg-actions button { background: rgba(0,0,0,0.5); border: none; color: #fff; border-radius: 4px; padding: 2px 5px; cursor: pointer; font-size: 9px; }
        
        .chat-input-area { padding: 8px 12px 12px 12px; background: #0d1b2a; border-top: 1px solid #2a3a5e; display: flex; gap: 8px; align-items: center; }
        .chat-input-area input { flex: 1; padding: 10px 14px; border-radius: 12px; border: 1px solid #2a3a5e; background: #16213e; color: #f0f4fa; font-size: 14px; outline: none; min-width: 0; }
        .chat-input-area input:focus { border-color: #4f8cf7; }
        .chat-input-area button { background: #4f8cf7; border: none; width: 42px; height: 42px; border-radius: 12px; color: #fff; font-size: 16px; cursor: pointer; transition: 0.15s; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .chat-input-area button:hover { background: #3a73e0; }
        .chat-input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
        .empty-chat { color: #667799; text-align: center; margin-top: 40px; font-size: 14px; }
        
        /* Модалка списка пользователей */
        #users-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1001; justify-content: center; align-items: center; padding: 16px; }
        .users-modal-content { background: #16213e; border-radius: 20px; padding: 24px; max-width: 400px; width: 100%; max-height: 80vh; overflow-y: auto; border: 1px solid #2a3a5e; }
        .users-modal-content h3 { color: #fff; margin-bottom: 16px; font-size: 18px; display: flex; align-items: center; gap: 8px; }
        .users-modal-content .user-item { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid #2a3a5e; }
        .users-modal-content .user-item .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: #2a3a5e; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #b8ccf0; font-size: 14px; overflow: hidden; flex-shrink: 0; position: relative; }
        .users-modal-content .user-item .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .users-modal-content .user-item .user-name { flex: 1; color: #e8edf5; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
        .users-modal-content .user-item .user-status { font-size: 12px; }
        .users-modal-content .user-item .user-status.online { color: #4ade80; }
        .users-modal-content .close-btn { background: none; border: none; color: #8899bb; font-size: 20px; cursor: pointer; padding: 4px 8px; }
        .users-modal-content .close-btn:hover { color: #f0f4fa; }
        .users-modal-content .user-item .vip-badge { background: #f5a623; color: #1a1a2e; border-radius: 10px; padding: 0 6px; font-size: 9px; font-weight: 700; }
        .users-modal-content .user-item .verified-icon { color: #4ade80; font-size: 12px; }
        
        #profile-modal, #create-chat-modal, #add-members-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; padding: 16px; }
        .modal-content { background: #16213e; border-radius: 20px; padding: 24px; max-width: 380px; width: 100%; border: 1px solid #2a3a5e; max-height: 90vh; overflow-y: auto; }
        .modal-content h3 { color: #fff; margin-bottom: 14px; font-size: 18px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #8899bb; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 14px; background: #0d1b2a; border: 1px solid #2a3a5e; border-radius: 10px; color: #f0f4fa; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: #4f8cf7; }
        .form-group input:disabled { opacity: 0.5; }
        .avatar-preview { width: 70px; height: 70px; border-radius: 50%; background: #2a3a5e; margin: 0 auto 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #b8ccf0; }
        .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
        .modal-actions { display: flex; gap: 8px; margin-top: 14px; }
        .modal-actions button { flex: 1; }
        .member-list { max-height: 150px; overflow-y: auto; margin: 8px 0; }
        .member-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: #0d1b2a; border-radius: 8px; margin: 4px 0; }
        .member-item .remove-btn { background: none; border: none; color: #e4566a; cursor: pointer; font-size: 14px; }
        
        @media (max-width: 768px) {
            body { padding: 0; }
            #app { height: 100vh; max-height: none; border-radius: 0; }
            .sidebar { width: 60px; min-width: 60px; }
            .sidebar-header h3 { font-size: 0; }
            .sidebar-header h3 i { font-size: 18px; }
            .sidebar-header .user-badge { font-size: 9px; padding: 2px 4px; }
            .sidebar-header .user-badge span { display: none; }
            .contact-item { padding: 6px 8px; gap: 6px; justify-content: center; }
            .contact-avatar { width: 32px; height: 32px; font-size: 12px; }
            .contact-name { font-size: 12px; }
            .contact-lastmsg { font-size: 10px; }
            .contact-time { font-size: 8px; }
            .contact-info .contact-name { display: none; }
            .contact-info .contact-lastmsg { display: none; }
            .contact-item .unread-badge { font-size: 8px; min-width: 14px; padding: 0 4px; }
            .chat-tabs button { font-size: 9px; padding: 6px 2px; }
            .chat-tabs button i { font-size: 14px; }
            .chat-tabs button span { display: none; }
            .message-wrapper .msg-content { max-width: 85%; }
            .message { font-size: 13px; padding: 6px 10px; }
            .chat-header .chat-partner { font-size: 13px; }
            .message-wrapper .msg-avatar { width: 28px; height: 28px; font-size: 11px; }
            .users-modal-content { max-width: 95%; }
            /* Центрируем чат на телефоне */
            .messenger-layout { justify-content: center; }
            .chat-area { max-width: 100%; }
        }
        
        @media (max-width: 480px) {
            .sidebar { width: 50px; min-width: 50px; }
            .contact-avatar { width: 28px; height: 28px; font-size: 10px; }
            .contact-avatar .status-dot { width: 8px; height: 8px; }
            .chat-header { padding: 8px 10px; }
            .chat-header .chat-partner { font-size: 12px; }
            .messages-container { padding: 8px 10px; }
            .chat-input-area { padding: 6px 10px 10px 10px; }
            .chat-input-area input { padding: 8px 12px; font-size: 13px; }
            .chat-input-area button { width: 36px; height: 36px; font-size: 14px; }
            .message-wrapper .msg-avatar { width: 24px; height: 24px; font-size: 9px; }
        }
        
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: #0d1b2a; }
        ::-webkit-scrollbar-thumb { background: #2a3a5e; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="app">
        <div id="auth-screen">
            <div class="auth-card">
                <h2>🍔 <span class="burger-icon">Burgergram</span></h2>
                <p class="sub">Вход или регистрация</p>
                <div id="auth-form">
                    <label><i class="fas fa-user"></i> Имя пользователя</label>
                    <input type="text" id="auth-username" placeholder="Логин (макс 12 симв.)" maxlength="12">
                    <label><i class="fas fa-lock"></i> Пароль</label>
                    <input type="password" id="auth-password" placeholder="Пароль">
                    <div class="actions">
                        <button class="btn-primary" id="login-btn"><i class="fas fa-sign-in-alt"></i> Войти</button>
                        <button class="btn-outline" id="register-btn"><i class="fas fa-user-plus"></i> Зарегистрироваться</button>
                    </div>
                    <div id="auth-message" style="display: none;"></div>
                </div>
            </div>
        </div>

        <div id="main-screen">
            <div class="messenger-layout">
                <div class="sidebar">
                    <div class="sidebar-header">
                        <h3 id="burger-menu"><i class="fas fa-hamburger"></i> Burgergram</h3>
                        <div style="display:flex;align-items:center;gap:3px;">
                            <span class="user-badge" id="profile-btn">
                                <i class="fas fa-user-circle"></i> <span id="current-username-display"></span>
                            </span>
                            <button class="logout-btn" id="logout-btn"><i class="fas fa-sign-out-alt"></i></button>
                        </div>
                    </div>
                    
                    <div class="chat-tabs">
                        <button class="active" data-tab="private"><i class="fas fa-user"></i> <span>Личные</span></button>
                        <button data-tab="group"><i class="fas fa-users"></i> <span>Группы</span></button>
                    </div>
                    
                    <div class="contact-list" id="contact-list">
                        <div style="padding:20px;color:#667799;text-align:center;font-size:13px;">Загрузка...</div>
                    </div>
                </div>

                <div class="chat-area">
                    <div class="chat-header">
                        <div class="chat-partner" id="chat-partner-name">Выберите чат</div>
                        <div class="typing-status" id="typing-status"></div>
                        <div class="chat-actions">
                            <button id="add-members-btn" title="Добавить участников"><i class="fas fa-user-plus"></i></button>
                            <button id="create-chat-btn" title="Создать чат"><i class="fas fa-plus"></i></button>
                            <button id="clear-chat-btn" title="Очистить"><i class="fas fa-trash"></i></button>
                            <button id="delete-chat-btn" title="Удалить чат"><i class="fas fa-times-circle"></i></button>
                        </div>
                    </div>
                    <div class="messages-container" id="messages-container">
                        <div class="empty-chat">🍔 Выберите чат</div>
                    </div>
                    <div class="chat-input-area">
                        <input type="text" id="message-input" placeholder="Сообщение..." disabled>
                        <button id="send-message-btn" disabled><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модалка списка пользователей -->
    <div id="users-modal">
        <div class="users-modal-content">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <h3><i class="fas fa-users" style="color:#4f8cf7;"></i> Пользователи в сети</h3>
                <button class="close-btn" id="users-modal-close">&times;</button>
            </div>
            <div id="users-list-modal"></div>
        </div>
    </div>

    <!-- МОДАЛКИ -->
    <div id="profile-modal">
        <div class="modal-content">
            <h3>⚙️ Настройки</h3>
            <div style="text-align:center;">
                <div class="avatar-preview" id="profile-avatar-preview"><i class="fas fa-user"></i></div>
            </div>
            <div class="form-group">
                <label>URL аватара</label>
                <input type="text" id="profile-avatar-input" placeholder="https://example.com/avatar.jpg">
            </div>
            <div class="form-group">
                <label>Отображаемое имя</label>
                <input type="text" id="profile-display-name" placeholder="Отображаемое имя">
            </div>
            <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text" id="profile-username" disabled>
            </div>
            <div class="modal-actions">
                <button class="btn-primary" id="profile-save-btn">Сохранить</button>
                <button class="btn-outline" id="profile-close-btn">Закрыть</button>
            </div>
        </div>
    </div>

    <div id="create-chat-modal">
        <div class="modal-content">
            <h3>📝 Создать чат</h3>
            <div class="form-group">
                <label>Тип</label>
                <select id="create-chat-type">
                    <option value="private">Личный</option>
                    <option value="group">Группа</option>

        // ============================================
        // ПОМОЩНИКИ
        // ============================================
        function showMsg(msg, type = 'error') {
            authMessage.style.display = 'block';
            authMessage.className = type === 'error' ? 'auth-error' : 'auth-success';
            authMessage.textContent = msg;
        }
        function hideMsg() { authMessage.style.display = 'none'; }

        function showNotif(title, body) {
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification('🍔 Burgergram', {
                    body: `${title}: ${body}`,
                    icon: 'https://cdn-icons-png.flaticon.com/512/3075/3075977.png'
                });
            }
        }

        function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
        }

        function saveSession(user) {
            if (user) localStorage.setItem('burgergram_session', JSON.stringify(user));
            else localStorage.removeItem('burgergram_session');
        }
        function loadSession() {
            try { return JSON.parse(localStorage.getItem('burgergram_session')); }
            catch { return null; }
        }

        function formatTime(date) {
            if (!date) return '';
            const d = new Date(date);
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function formatLastSeen(date) {
            if (!date) return 'недавно';
            const d = new Date(date);
            const now = new Date();
            const diff = Math.floor((now - d) / 1000);
            
            if (diff < 60) return 'только что';
            if (diff < 3600) return Math.floor(diff / 60) + ' мин назад';
            if (diff < 86400) return Math.floor(diff / 3600) + ' ч назад';
            return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function getStatusText(user) {
            if (!user) return 'не в сети';
            if (user.is_online) return '🟢 в сети';
            return '⚫ был(а) ' + formatLastSeen(user.last_seen);
        }

        function getAvatar(user) {
            if (!user) return DEFAULT_AVATAR;
            return user.avatar_url || DEFAULT_AVATAR;
        }

        function getInitials(name) {
            if (!name) return '?';
            return name.charAt(0).toUpperCase();
        }

        // ============================================
        // АВТОРИЗАЦИЯ
        // ============================================
        async function registerUser() {
            const username = authUsername.value.trim();
            const password = authPassword.value.trim();
            if (!username || !password) return showMsg('❌ Заполните поля');
            if (username.length < 3) return showMsg('❌ Минимум 3 символа');
            if (username.length > 12) return showMsg('❌ Максимум 12 символов');
            if (password.length < 4) return showMsg('❌ Пароль минимум 4 символа');
            hideMsg();

            try {
                const { data: existing } = await sb.from('users').select('id').eq('username', username).maybeSingle();
                if (existing) return showMsg('❌ Пользователь уже существует');

                const { error } = await sb.from('users').insert([{
                    username, password, display_name: username,
                    verified: false, is_online: true, last_seen: new Date().toISOString(),
                    avatar_url: DEFAULT_AVATAR, vip: false
                }]);
                if (error) throw error;

                showMsg('✅ Регистрация успешна!', 'success');
                setTimeout(() => loginUser(username, password), 1000);
            } catch (e) { showMsg('❌ ' + e.message); }
        }

        async function loginUser(username, password) {
            if (!username || !password) return showMsg('❌ Введите данные');
            hideMsg();

            try {
                const { data, error } = await sb
                    .from('users')
                    .select('*')
                    .eq('username', username)
                    .eq('password', password)
                    .maybeSingle();
                if (error || !data) return showMsg('❌ Неверный логин или пароль');

                currentUser = data;
                saveSession(data);
                await sb.from('users').update({ is_online: true, last_seen: new Date().toISOString() }).eq('id', data.id);
                currentUsernameDisplay.textContent = data.display_name || data.username;
                requestNotificationPermission();
                enterMainScreen();
            } catch (e) { showMsg('❌ ' + e.message); }
        }

        // ============================================
        // ОСНОВНАЯ ЛОГИКА
        // ============================================
        function enterMainScreen() {
            authScreen.style.display = 'none';
            mainScreen.style.display = 'flex';
            loadChats();
            setupRealtime();
            messageInput.disabled = false;
            sendBtn.disabled = false;
            setupTyping();
            startOnlinePing();
            startStatusMonitoring();
        }

        async function logout() {
            if (currentUser) {
                await sb.from('users').update({ is_online: false, last_seen: new Date().toISOString() }).eq('id', currentUser.id);
            }
            if (channel) {
                await sb.removeChannel(channel);
                channel = null;
            }
            currentUser = null; currentChatId = null;
            saveSession(null);
            authScreen.style.display = 'flex';
            mainScreen.style.display = 'none';
            contactList.innerHTML = '';
            messagesContainer.innerHTML = '<div class="empty-chat">🍔 Выберите чат</div>';
            chatPartnerName.textContent = 'Выберите чат';
            messageInput.disabled = true;
            sendBtn.disabled = true;
            hideMsg();
        }

        function startOnlinePing() {
            setInterval(async () => {
                if (currentUser) {
                    await sb.from('users').update({ is_online: true, last_seen: new Date().toISOString() }).eq('id', currentUser.id);
                }
            }, 30000);
        }

        function startStatusMonitoring() {
            setInterval(async () => {
                if (!currentUser) return;
                const { data } = await sb
                    .from('users')
                    .select('id, is_online, last_seen, verified, vip')
                    .neq('id', currentUser.id);
                if (data) {
                    data.forEach(u => {
                        const user = allUsers.find(au => au.id === u.id);
                        if (user) {
                            user.is_online = u.is_online;
                            user.last_seen = u.last_seen;
                            user.verified = u.verified;
                            user.vip = u.vip;
                        }
                    });
                    updateStatusIndicators();
                    updateChatHeaderStatus();
                    updateUsersModal();
                }
            }, 5000);
        }

        function updateStatusIndicators() {
            document.querySelectorAll('.contact-item').forEach(item => {
                const avatar = item.querySelector('.contact-avatar');
                if (!avatar) return;
                const nameEl = item.querySelector('.contact-name');
                if (!nameEl) return;
                const username = nameEl.textContent.trim();
                const user = allUsers.find(u => (u.display_name || u.username) === username);
                if (user) {
                    const dot = avatar.querySelector('.status-dot');
                    if (dot) {
                        dot.className = `status-dot ${user.is_online ? 'online' : 'offline'}`;
                    }
                }
            });
        }

        function updateChatHeaderStatus() {
            if (!currentChatId) return;
            const chat = allChats.find(c => c.id === currentChatId);
            if (!chat) return;
            
            if (chat.type === 'private') {
                const member = chat.chat_members?.find(m => m.user_id !== currentUser.id);
                if (!member) return;
                const partner = allUsers.find(u => u.id === member.user_id);
                if (!partner) return;

                const statusText = getStatusText(partner);
                const name = partner.display_name || partner.username;
                chatPartnerName.innerHTML = `
                    ${name}
                    ${partner.verified ? '<i class="fas fa-check-circle verified-icon" style="color:#4ade80;font-size:12px;"></i>' : ''}
                    ${partner.vip ? '<span class="vip-icon" style="color:#f5a623;font-size:12px;font-weight:700;">👑 VIP</span>' : ''}
                    <span class="status-text">${statusText}</span>
                `;
            } else {
                // Группа - показываем название и корону если создатель
                const isCreator = chat.created_by === currentUser.id;
                chatPartnerName.innerHTML = `
                    ${chat.name || 'Группа'}
                    ${isCreator ? '<span style="color:#f5a623;font-size:12px;">👑 Создатель</span>' : ''}
                `;
            }
        }

        // ============================================
        // REALTIME
        // ============================================
        function setupRealtime() {
            if (channel) {
                sb.removeChannel(channel);
                channel = null;
            }

            console.log('🔄 Подключение Realtime...');

            channel = sb
                .channel('public:messages')
                .on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'messages'
                }, async (payload) => {
                    const msg = payload.new;
                    if (msg.is_deleted) return;
                    if (msg.sender_id === currentUser.id) return;

                    await loadChats();

                    if (currentChatId === msg.chat_id) {
                        const sender = allUsers.find(u => u.id === msg.sender_id);
                        const senderName = sender?.display_name || sender?.username || 'Собеседник';
                        appendMessage(msg.content, false, senderName, msg.created_at, msg.id, sender);
                        chatMessages[currentChatId] = messagesContainer.innerHTML;
                    }

                    const chat = allChats.find(c => c.id === msg.chat_id);
                    if (chat) {
                        let chatName = chat.name;
                        if (chat.type === 'private') {
                            const member = chat.chat_members?.find(m => m.user_id !== currentUser.id);
                            const partner = allUsers.find(u => u.id === member?.user_id);
                            chatName = partner?.display_name || partner?.username || 'Чат';
                        }
                        showNotif(chatName, msg.content);
                    }
                })
                .subscribe((status) => {
                    console.log('📡 Realtime статус:', status);
                });

            // Подписка на изменения статуса печатает - ИСПРАВЛЕНО!
            sb
                .channel('public:chat_members')
                .on('postgres_changes', {
                    event: 'UPDATE',
                    schema: 'public',
                    table: 'chat_members'
                }, (payload) => {
                    const data = payload.new;
                    if (data.chat_id === currentChatId && data.user_id !== currentUser.id) {
                        if (data.is_typing) {
                            const user = allUsers.find(u => u.id === data.user_id);
                            const name = user?.display_name || user?.username || 'Кто-то';
                            typingStatus.textContent = `✏️ ${name} печатает...`;
                        } else {
                            typingStatus.textContent = '';
                        }
                    }
                })
                .subscribe();
        }

        // ============================================
        // ЗАГРУЗКА ЧАТОВ
        // ============================================
        async function loadChats() {
            if (!currentUser) return;
            try {
                const { data: members, error: mError } = await sb
                    .from('chat_members')
                    .select('chat_id, role, last_read, is_typing')
                    .eq('user_id', currentUser.id);

                if (mError) throw mError;

                const chatIds = members.map(m => m.chat_id);
                
                if (chatIds.length === 0) {
                    allChats = [];
                    renderChatList();
                    return;
                }

                const { data: chats, error: cError } = await sb
                    .from('chats')
                    .select('*')
                    .in('id', chatIds);

                if (cError) throw cError;

                const { data: users } = await sb
                    .from('users')
                    .select('id, username, display_name, avatar_url, verified, is_online, last_seen, vip');
                allUsers = users || [];

                for (let chat of chats) {
                    const { data: chatMembers } = await sb
                        .from('chat_members')
                        .select('user_id, role, is_typing')
                        .eq('chat_id', chat.id);
                    chat.chat_members = chatMembers || [];

                    const { data: lastMsg } = await sb
                        .from('messages')
                        .select('*')
                        .eq('chat_id', chat.id)
                        .eq('is_deleted', false)
                        .order('created_at', { ascending: false })
                        .limit(1);
                    chat.last_message = lastMsg?.[0] || null;

                    const member = members.find(m => m.chat_id === chat.id);
                    if (member) {
                        const { count } = await sb
                            .from('messages')
                            .select('*', { count: 'exact', head: true })
                            .eq('chat_id', chat.id)
                            .gt('created_at', member.last_read || new Date(0))
                            .neq('sender_id', currentUser.id)
                            .eq('is_deleted', false);
                        chat.unread_count = count || 0;
                    }
                }

                allChats = chats;
                renderChatList();

            } catch (e) {
                console.error('❌ Ошибка загрузки чатов:', e);
            }
        }

        function renderChatList() {
            const filtered = allChats.filter(c => c.type === currentTab);
            contactList.innerHTML = '';

            if (filtered.length === 0) {
                contactList.innerHTML = `<div style="padding:20px;color:#667799;text-align:center;font-size:12px;">
                    Нет ${currentTab === 'private' ? 'личных' : 'групп'}<br>
                    <span style="font-size:10px;">Нажмите + для создания</span>
                </div>`;
                return;
            }

            filtered.forEach(chat => {
                const div = document.createElement('div');
                div.className = 'contact-item';
                if (currentChatId === chat.id) div.classList.add('active');

                let partner = null;
                let chatName = chat.name || 'Чат';
                let isChatTyping = false;
                let isVip = false;
                let isVerified = false;
                let isCreator = false;
                
                if (chat.type === 'private') {
                    const member = chat.chat_members?.find(m => m.user_id !== currentUser.id);
                    if (member) {
                        partner = allUsers.find(u => u.id === member.user_id);
                        chatName = partner?.display_name || partner?.username || 'Unknown';
                        isChatTyping = member.is_typing || false;
                        isVip = partner?.vip || false;
                        isVerified = partner?.verified || false;
                    }
                } else {
                    const typingMembers = chat.chat_members?.filter(m => m.user_id !== currentUser.id && m.is_typing) || [];
                    isChatTyping = typingMembers.length > 0;
                    isCreator = chat.created_by === currentUser.id;
                    // Проверяем VIP среди участников группы
                    const vipMembers = chat.chat_members?.filter(m => {
                        const user = allUsers.find(u => u.id === m.user_id);
                        return user?.vip;
                    }) || [];
                    isVip = vipMembers.length > 0;
                    // Проверяем verified среди участников
                    const verifiedMembers = chat.chat_members?.filter(m => {
                        const user = allUsers.find(u => u.id === m.user_id);
                        return user?.verified;
                    }) || [];
                    isVerified = verifiedMembers.length > 0;
                }

                const avatar = document.createElement('div');
                avatar.className = 'contact-avatar';
                const avatarUrl = chat.type === 'private' ? partner?.avatar_url : chat.avatar_url;
                
                if (avatarUrl && avatarUrl !== DEFAULT_AVATAR) {
                    avatar.innerHTML = `<img src="${avatarUrl}" alt="${chatName}">`;
                } else {
                    avatar.textContent = chatName.charAt(0).toUpperCase();
                }

                const dot = document.createElement('div');
                if (chat.type === 'private' && partner) {
                    dot.className = `status-dot ${isChatTyping ? 'typing' : (partner.is_online ? 'online' : 'offline')}`;
                } else if (chat.type === 'group' && isChatTyping) {
                    dot.className = 'status-dot typing';
                } else {
                    dot.className = 'status-dot offline';
                }
                avatar.appendChild(dot);

                if (isVip) {
                    const vipBadge = document.createElement('div');
                    vipBadge.className = 'vip-badge';
                    vipBadge.textContent = 'VIP';
                    avatar.appendChild(vipBadge);
                }

                if (isCreator && chat.type === 'group') {
                    const crownBadge = document.createElement('div');
                    crownBadge.className = 'crown-badge';
                    crownBadge.innerHTML = '👑';
                    avatar.appendChild(crownBadge);
                }

                const info = document.createElement('div');
                info.className = 'contact-info';

                const nameDiv = document.createElement('div');
                nameDiv.className = 'contact-name';
                nameDiv.textContent = chatName;
                
                if (chat.type === 'group') {
                    const badge = document.createElement('span');
                    badge.className = 'chat-type-badge';
                    badge.textContent = 'Группа';
                    nameDiv.appendChild(badge);
                }
                if (isVerified) {
                    const icon = document.createElement('i');
                    icon.className = 'fas fa-check-circle verified-icon';
                    nameDiv.appendChild(icon);
                }
                if (isVip) {
                    const vipIcon = document.createElement('span');
                    vipIcon.className = 'vip-icon';
                    vipIcon.textContent = '👑 VIP';
                    nameDiv.appendChild(vipIcon);
                }
                if (isCreator && chat.type === 'group') {
                    const crownIcon = document.createElement('span');
                    crownIcon.className = 'crown-icon';
                    crownIcon.innerHTML = '👑';
                    nameDiv.appendChild(crownIcon);
                }

                const lastMsg = document.createElement('div');
                lastMsg.className = 'contact-lastmsg';
                if (chat.last_message) {
                    const sender = chat.last_message.sender_id === currentUser.id ? 'Вы: ' : '';
                    lastMsg.textContent = sender + chat.last_message.content;
                } else {
                    lastMsg.textContent = 'Нет сообщений';
                }

                const time = document.createElement('div');
                time.className = 'contact-time';
                if (chat.last_message?.created_at) {
                    time.textContent = formatTime(chat.last_message.created_at);
                }

                info.appendChild(nameDiv);
                info.appendChild(lastMsg);
                div.appendChild(avatar);
                div.appendChild(info);
                div.appendChild(time);

                if (chat.unread_count > 0) {
                    const badge = document.createElement('span');
                    badge.className = 'unread-badge';
                    badge.textContent = chat.unread_count > 99 ? '99+' : chat.unread_count;
                    div.appendChild(badge);
                }

                div.addEventListener('click', () => openChat(chat.id));
                contactList.appendChild(div);
            });
        }

        // ============================================
        // ОТКРЫТЬ ЧАТ
        // ============================================
        async function openChat(chatId) {
            if (!currentUser || !chatId) return;
            
            if (currentChatId && chatMessages[currentChatId]) {
                chatMessages[currentChatId] = messagesContainer.innerHTML;
            }

            currentChatId = chatId;
            const chat = allChats.find(c => c.id === chatId);
            if (!chat) return;

            let partner = null;
            let chatName = chat.name || 'Чат';
            let isVip = false;
            let isVerified = false;
            let isCreator = false;
            
            if (chat.type === 'private') {
                const member = chat.chat_members?.find(m => m.user_id !== currentUser.id);
                if (member) {
                    partner = allUsers.find(u => u.id === member.user_id);
                    chatName = partner?.display_name || partner?.username || 'Чат';
                    isVip = partner?.vip || false;
                    isVerified = partner?.verified || false;
                }
            } else {
                isCreator = chat.created_by === currentUser.id;
                // Проверяем VIP среди участников группы
                const vipMembers = chat.chat_members?.filter(m => {
                    const user = allUsers.find(u => u.id === m.user_id);
                    return user?.vip;
                }) || [];
                isVip = vipMembers.length > 0;
                const verifiedMembers = chat.chat_members?.filter(m => {
                    const user = allUsers.find(u => u.id === m.user_id);
                    return user?.verified;
                }) || [];
                isVerified = verifiedMembers.length > 0;
            }

            let statusText = '';
            if (partner) {
                statusText = getStatusText(partner);
            }

            chatPartnerName.innerHTML = `
                ${chatName}
                ${isVerified ? '<i class="fas fa-check-circle verified-icon" style="color:#4ade80;font-size:12px;"></i>' : ''}
                ${isVip ? '<span class="vip-icon" style="color:#f5a623;font-size:12px;font-weight:700;">👑 VIP</span>' : ''}
                ${isCreator && chat.type === 'group' ? '<span style="color:#f5a623;font-size:12px;">👑 Создатель</span>' : ''}
                ${partner ? `<span class="status-text">${statusText}</span>` : ''}
            `;

            await sb
                .from('chat_members')
                .update({ last_read: new Date().toISOString() })
                .eq('chat_id', chatId)
                .eq('user_id', currentUser.id);

            if (chatMessages[chatId]) {
                messagesContainer.innerHTML = chatMessages[chatId];
            } else {
                await loadMessages(chatId);
            }

            messageInput.disabled = false;
            sendBtn.disabled = false;
            messageInput.focus();
            loadChats();
        }

        // ============================================
        // ЗАГРУЗКА СООБЩЕНИЙ
        // ============================================
        async function loadMessages(chatId) {
            if (!chatId) return;
            try {
                const { data, error } = await sb
                    .from('messages')
                    .select('*')
                    .eq('chat_id', chatId)
                    .eq('is_deleted', false)
                    .order('created_at', { ascending: true })
                    .limit(50);

                if (error) throw error;

                messagesContainer.innerHTML = '';
                if (!data || data.length === 0) {
                    messagesContainer.innerHTML = '<div class="empty-chat">🍔 Начните общение</div>';
                    return;
                }

                data.forEach(msg => {
                    const isOwn = msg.sender_id === currentUser.id;
                    const sender = allUsers.find(u => u.id === msg.sender_id);
                    const senderName = isOwn ? 'Вы' : (sender?.display_name || sender?.username || 'Неизвестный');
                    appendMessage(msg.content, isOwn, senderName, msg.created_at, msg.id, sender);
                });

                messagesContainer.scrollTop = messagesContainer.scrollHeight;
                chatMessages[chatId] = messagesContainer.innerHTML;

            } catch (e) { console.error('Ошибка загрузки:', e); }
        }

        function appendMessage(text, isOwn, senderName, timestamp, msgId, sender) {
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${isOwn ? 'own' : ''}`;

            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            const avatarUrl = sender?.avatar_url;
            if (avatarUrl && avatarUrl !== DEFAULT_AVATAR) {
                avatar.innerHTML = `<img src="${avatarUrl}" alt="${senderName}">`;
            } else {
                avatar.textContent = senderName.charAt(0).toUpperCase();
            }

            if (sender?.vip) {
                const vipBadge = document.createElement('div');
                vipBadge.className = 'vip-badge';
                vipBadge.textContent = 'VIP';
                avatar.appendChild(vipBadge);
            }

            if (sender && currentChatId) {
                const chat = allChats.find(c => c.id === currentChatId);
                if (chat && chat.type === 'group' && chat.created_by === sender.id) {
                    const crownBadge = document.createElement('div');
                    crownBadge.className = 'crown-badge';
                    crownBadge.innerHTML = '👑';
                    avatar.appendChild(crownBadge);
                }
            }

            wrapper.appendChild(avatar);

            const content = document.createElement('div');
            content.className = 'msg-content';

            const senderEl = document.createElement('div');
            senderEl.className = 'msg-sender';
            senderEl.innerHTML = senderName;
            
            if (sender?.vip) {
                senderEl.innerHTML += ' <span class="vip-icon">👑 VIP</span>';
            }
            if (sender?.verified) {
                senderEl.innerHTML += ' <span class="verified-icon"><i class="fas fa-check-circle"></i></span>';
            }
            if (sender && currentChatId) {
                const chat = allChats.find(c => c.id === currentChatId);
                if (chat && chat.type === 'group' && chat.created_by === sender.id) {
                    senderEl.innerHTML += ' <span class="crown-icon">👑</span>';
                }
            }
            content.appendChild(senderEl);

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            msgDiv.dataset.msgId = msgId || Date.now();

            const textSpan = document.createElement('div');
            textSpan.textContent = text;
            msgDiv.appendChild(textSpan);

            const timeSpan = document.createElement('div');
            timeSpan.className = 'msg-time';
            if (timestamp) {
                timeSpan.textContent = formatTime(timestamp);
            }
            msgDiv.appendChild(timeSpan);

            const actions = document.createElement('div');
            actions.className = 'msg-actions';
            if (isOwn) {
                const delBtn = document.createElement('button');
                delBtn.innerHTML = '<i class="fas fa-trash"></i>';
                delBtn.onclick = (e) => { e.stopPropagation(); deleteMessage(msgId); };
                actions.appendChild(delBtn);
            }
            msgDiv.appendChild(actions);

            content.appendChild(msgDiv);
            wrapper.appendChild(content);
            messagesContainer.appendChild(wrapper);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // ============================================
        // ОТПРАВКА СООБЩЕНИЯ
        // ============================================
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !currentUser || !currentChatId) return;

            messageInput.value = '';
            messageInput.disabled = true;
            sendBtn.disabled = true;

            await updateTypingStatus(false);

            try {
                const { data, error } = await sb
                    .from('messages')
                    .insert([{
                        chat_id: currentChatId,
                        sender_id: currentUser.id,
                        content: text,
                        created_at: new Date().toISOString()
                    }])
                    .select()
                    .single();

                if (error) throw error;
                
                appendMessage(text, true, 'Вы', data.created_at, data.id, currentUser);
                chatMessages[currentChatId] = messagesContainer.innerHTML;
                
                messageInput.disabled = false;
                sendBtn.disabled = false;
                messageInput.focus();
                loadChats();

            } catch (e) {
                console.error('Ошибка:', e);
                messageInput.value = text;
                messageInput.disabled = false;
                sendBtn.disabled = false;
            }
        }

        // ============================================
        // ТАЙПИНГ - ИСПРАВЛЕНО!
        // ============================================
        function setupTyping() {
            let typingTimeout = null;
            
            messageInput.addEventListener('input', async () => {
                if (!currentChatId) return;
                // Показываем статус у себя
                typingStatus.textContent = '✏️ печатает...';
                await updateTypingStatus(true);
                
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(async () => {
                    typingStatus.textContent = '';
                    await updateTypingStatus(false);
                }, 2000);
            });
        }

        async function updateTypingStatus(isTyping) {
            if (!currentUser || !currentChatId) return;
            try {
                await sb
                    .from('chat_members')
                    .update({ 
                        is_typing: isTyping,
                        typing_at: isTyping ? new Date().toISOString() : null
                    })
                    .eq('chat_id', currentChatId)
                    .eq('user_id', currentUser.id);
            } catch (e) {
                console.error('Ошибка обновления статуса печатает:', e);
            }
        }

        // ============================================
        // УДАЛЕНИЕ СООБЩЕНИЯ
        // ============================================
        async function deleteMessage(msgId) {
            if (!msgId || !currentUser) return;
            if (!confirm('Удалить сообщение?')) return;

            try {
                await sb.from('messages').update({ is_deleted: true }).eq('id', msgId).eq('sender_id', currentUser.id);
                const el = document.querySelector(`[data-msg-id="${msgId}"]`);
                if (el) {
                    const wrapper = el.closest('.message-wrapper');
                    if (wrapper) wrapper.remove();
                }
                chatMessages[currentChatId] = messagesContainer.innerHTML;
            } catch (e) { console.error('Ошибка:', e); }
        }

        // ============================================
        // ОЧИСТКА/УДАЛЕНИЕ ЧАТА
        // ============================================
        async function clearChat() {
            if (!currentChatId) return;
            if (!confirm('Очистить историю чата?')) return;
            try {
                await sb.from('messages').update({ is_deleted: true }).eq('chat_id', currentChatId);
                chatMessages[currentChatId] = null;
                await loadMessages(currentChatId);
            } catch (e) { console.error('Ошибка:', e); }
        }

        async function deleteChat() {
            if (!currentChatId) return;
            if (!confirm('Удалить чат навсегда?')) return;
            try {
                await sb.from('messages').delete().eq('chat_id', currentChatId);
                await sb.from('chat_members').delete().eq('chat_id', currentChatId);
                await sb.from('chats').delete().eq('id', currentChatId);

                delete chatMessages[currentChatId];
                currentChatId = null;
                messagesContainer.innerHTML = '<div class="empty-chat">🍔 Чат удален</div>';
                chatPartnerName.textContent = 'Выберите чат';
                document.querySelectorAll('.contact-item').forEach(el => el.classList.remove('active'));
                await loadChats();
            } catch (e) { console.error('Ошибка:', e); }
        }

        // ============================================
        // СОЗДАНИЕ ЧАТА
        // ============================================
        function openCreateChat() {
            createChatModal.style.display = 'flex';
            createChatName.value = '';
            createChatUser.value = '';
            createChatError.style.display = 'none';
            toggleChatNameField();
        }

        function toggleChatNameField() {
            const type = createChatType.value;
            document.getElementById('create-chat-name-group').style.display = type === 'private' ? 'none' : 'block';
        }

        createChatType.addEventListener('change', toggleChatNameField);

        async function createChat() {
            const type = createChatType.value;
            const name = createChatName.value.trim();
            const username = createChatUser.value.trim();

            createChatError.style.display = 'none';

            if (!username) {
                createChatError.textContent = '❌ Введите имя пользователя';
                createChatError.style.display = 'block';
                return;
            }

            if (type === 'group' && !name) {
                createChatError.textContent = '❌ Введите название группы';
                createChatError.style.display = 'block';
                return;
            }

            try {
                const { data: user, error: uError } = await sb
                    .from('users')
                    .select('id')
                    .eq('username', username)
                    .maybeSingle();

                if (uError || !user) {
                    createChatError.textContent = '❌ Пользователь не найден';
                    createChatError.style.display = 'block';
                    return;
                }

                if (user.id === currentUser.id) {
                    createChatError.textContent = '❌ Нельзя создать чат с самим собой';
                    createChatError.style.display = 'block';
                    return;
                }

                let chatId;

                if (type === 'private') {
                    const { data: existingChats } = await sb
                        .from('chat_members')
                        .select('chat_id')
                        .eq('user_id', currentUser.id);

                    let existingChatId = null;
                    for (let member of existingChats || []) {
                        const { data: otherMember } = await sb
                            .from('chat_members')
                            .select('user_id')
                            .eq('chat_id', member.chat_id)
                            .eq('user_id', user.id)
                            .maybeSingle();
                        
                        if (otherMember) {
                            existingChatId = member.chat_id;
                            break;
                        }
                    }

                    if (existingChatId) {
                        createChatModal.style.display = 'none';
                        await loadChats();
                        setTimeout(() => openChat(existingChatId), 500);
                        return;
                    }

                    const { data: newChat, error: cError } = await sb
                        .from('chats')
                        .insert([{ name: '', type: 'private', created_by: currentUser.id }])
                        .select()
                        .single();

                    if (cError) throw cError;
                    chatId = newChat.id;

                    await sb.from('chat_members').insert([
                        { chat_id: chatId, user_id: currentUser.id, role: 'admin' },
                        { chat_id: chatId, user_id: user.id, role: 'member' }
                    ]);

                } else {
                    const { data: newChat, error: cError } = await sb
                        .from('chats')
                        .insert([{ name, type: 'group', created_by: currentUser.id }])
                        .select()
                        .single();

                    if (cError) throw cError;
                    chatId = newChat.id;

                    await sb.from('chat_members').insert([
                        { chat_id: chatId, user_id: currentUser.id, role: 'admin' },
                        { chat_id: chatId, user_id: user.id, role: 'member' }
                    ]);
                }

                createChatModal.style.display = 'none';
                await loadChats();
                setTimeout(() => openChat(chatId), 500);

            } catch (e) {
                console.error('Ошибка создания чата:', e);
                createChatError.textContent = '❌ ' + (e.message || 'Ошибка создания чата');
                createChatError.style.display = 'block';
            }
        }

        // ============================================
        // ДОБАВЛЕНИЕ УЧАСТНИКОВ
        // ============================================
        async function openAddMembers() {
            if (!currentChatId) {
                alert('Сначала выберите чат');
                return;
            }
            const chat = allChats.find(c => c.id === currentChatId);
            if (!chat || chat.type === 'private') {
                alert('Только для групп');
                return;
            }
            
            addMembersModal.style.display = 'flex';
            addMemberInput.value = '';
            addMemberError.style.display = 'none';
            await loadMembersList();
        }

        async function loadMembersList() {
            if (!currentChatId) return;
            const { data } = await sb
                .from('chat_members')
                .select('user_id')
                .eq('chat_id', currentChatId);
            
            const memberIds = data?.map(m => m.user_id) || [];
            const members = allUsers.filter(u => memberIds.includes(u.id));
            
            membersList.innerHTML = members.map(m => `
                <div class="member-item">
                    <span>${m.display_name || m.username} ${m.vip ? '👑 VIP' : ''} ${m.verified ? '✅' : ''}</span>
                    ${m.id !== currentUser.id ? `<button class="remove-btn" onclick="removeMember('${m.id}')">✕</button>` : ''}
                </div>
            `).join('');
        }

        async function addMember() {
            const username = addMemberInput.value.trim();
            if (!username) {
                addMemberError.textContent = '❌ Введите имя пользователя';
                addMemberError.style.display = 'block';
                return;
            }

            try {
                const { data: user } = await sb
                    .from('users')
                    .select('id')
                    .eq('username', username)
                    .maybeSingle();

                if (!user) {
                    addMemberError.textContent = '❌ Пользователь не найден';
                    addMemberError.style.display = 'block';
                    return;
                }

                const { data: existing } = await sb
                    .from('chat_members')
                    .select('user_id')
                    .eq('chat_id', currentChatId)
                    .eq('user_id', user.id)
                    .maybeSingle();

                if (existing) {
                    addMemberError.textContent = '❌ Пользователь уже в группе';
                    addMemberError.style.display = 'block';
                    return;
                }

                await sb.from('chat_members').insert([
                    { chat_id: currentChatId, user_id: user.id, role: 'member' }
                ]);

                addMemberInput.value = '';
                addMemberError.style.display = 'none';
                await loadMembersList();
                await loadChats();

            } catch (e) {
                addMemberError.textContent = '❌ ' + e.message;
                addMemberError.style.display = 'block';
            }
        }

        async function removeMember(userId) {
            if (!confirm('Удалить участника?')) return;
            try {
                await sb
                    .from('chat_members')
                    .delete()
                    .eq('chat_id', currentChatId)
                    .eq('user_id', userId);
                await loadMembersList();
                await loadChats();
            } catch (e) { console.error('Ошибка:', e); }
        }

        // ============================================
        // СПИСОК ПОЛЬЗОВАТЕЛЕЙ (БУРГЕР)
        // ============================================
        function openUsersModal() {
            usersModal.style.display = 'flex';
            updateUsersModal();
        }

        function updateUsersModal() {
            const onlineUsers = allUsers.filter(u => u.is_online);
            if (onlineUsers.length === 0) {
                usersListModal.innerHTML = '<div style="color:#667799;text-align:center;padding:20px;">Нет пользователей в сети</div>';
                return;
            }

            usersListModal.innerHTML = onlineUsers.map(u => `
                <div class="user-item">
                    <div class="user-avatar">
                        ${(u.avatar_url && u.avatar_url !== DEFAULT_AVATAR) ? `<img src="${u.avatar_url}" alt="${u.username}">` : u.username.charAt(0).toUpperCase()}
                        ${u.vip ? '<span style="position:absolute;bottom:-2px;right:-2px;background:#f5a623;color:#1a1a2e;border-radius:50%;width:14px;height:14px;font-size:7px;display:flex;align-items:center;justify-content:center;border:2px solid #16213e;font-weight:700;">VIP</span>' : ''}
                    </div>
                    <div class="user-name">
                        ${u.display_name || u.username}
                        ${u.verified ? '<span class="verified-icon"><i class="fas fa-check-circle"></i></span>' : ''}
                        ${u.vip ? '<span class="vip-badge">VIP</span>' : ''}
                    </div>
                    <div class="user-status online">🟢 в сети</div>
                </div>
            `).join('');
        }

        // ============================================
        // ПРОФИЛЬ
        // ============================================
        function openProfile() {
            if (!currentUser) return;
            profileUsername.value = currentUser.username;
            profileDisplayName.value = currentUser.display_name || currentUser.username;
            profileAvatarInput.value = currentUser.avatar_url || '';
            updateProfileAvatar(currentUser.avatar_url);
            profileModal.style.display = 'flex';
        }

        function updateProfileAvatar(url) {
            if (url && url !== DEFAULT_AVATAR) {
                profileAvatarPreview.innerHTML = `<img src="${url}" alt="avatar">`;
            } else {
                profileAvatarPreview.innerHTML = '<i class="fas fa-user"></i>';
            }
        }

        async function saveProfile() {
            if (!currentUser) return;
            const displayName = profileDisplayName.value.trim() || currentUser.username;
            const avatarUrl = profileAvatarInput.value.trim() || DEFAULT_AVATAR;

            try {
                await sb
                    .from('users')
                    .update({
                        display_name: displayName,
                        avatar_url: avatarUrl
                    })
                    .eq('id', currentUser.id);

                currentUser.display_name = displayName;
                currentUser.avatar_url = avatarUrl;
                currentUsernameDisplay.textContent = displayName;
                saveSession(currentUser);
                updateProfileAvatar(avatarUrl);
                await loadChats();
                profileModal.style.display = 'none';

            } catch (e) {
                console.error('Ошибка:', e);
                alert('Ошибка сохранения: ' + e.message);
            }
        }

        // ============================================
        // ВКЛАДКИ
        // ============================================
        document.querySelectorAll('.chat-tabs button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.chat-tabs button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTab = btn.dataset.tab;
                renderChatList();
            });
        });

        // ============================================
        // ОБРАБОТЧИКИ
        // ============================================
        loginBtn.onclick = () => loginUser(authUsername.value.trim(), authPassword.value.trim());
        registerBtn.onclick = registerUser;
        logoutBtn.onclick = logout;
        sendBtn.onclick = sendMessage;
        messageInput.onkeydown = (e) => { if (e.key === 'Enter') sendMessage(); };
        clearChatBtn.onclick = clearChat;
        deleteChatBtn.onclick = deleteChat;
        createChatBtn.onclick = openCreateChat;
        addMembersBtn.onclick = openAddMembers;
        burgerMenu.onclick = openUsersModal;
        usersModalClose.onclick = () => usersModal.style.display = 'none';
        createChatCloseBtn.onclick = () => createChatModal.style.display = 'none';
        createChatBtnAction.onclick = createChat;
        addMembersCloseBtn.onclick = () => addMembersModal.style.display = 'none';
        addMemberBtn.onclick = addMember;
        profileBtn.onclick = openProfile;
        profileCloseBtn.onclick = () => profileModal.style.display = 'none';
        profileSaveBtn.onclick = saveProfile;
        profileAvatarInput.oninput = () => updateProfileAvatar(profileAvatarInput.value);

        profileModal.onclick = (e) => { if (e.target === profileModal) profileModal.style.display = 'none'; };
        createChatModal.onclick = (e) => { if (e.target === createChatModal) createChatModal.style.display = 'none'; };
        addMembersModal.onclick = (e) => { if (e.target === addMembersModal) addMembersModal.style.display = 'none'; };
        usersModal.onclick = (e) => { if (e.target === usersModal) usersModal.style.display = 'none'; };

        // ============================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================
        window.onload = function() {
            console.log('🍔 Burgergram загружен!');

            const saved = loadSession();
            if (saved) {
                currentUser = saved;
                currentUsernameDisplay.textContent = currentUser.display_name || currentUser.username;
                enterMainScreen();
                sb.from('users').update({ is_online: true }).eq('id', currentUser.id);
            }

            sb.from('users').select('count').limit(1)
                .then(() => console.log('✅ Подключено к Supabase'))
                .catch(e => console.error('❌ Ошибка:', e));
        };
    </script>
</body>
</html>
