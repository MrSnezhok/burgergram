<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burgergram</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        #app {
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            background: #1a1a2e;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* АВТОРИЗАЦИЯ */
        #auth-screen {
            display: flex;
            flex: 1;
            justify-content: center;
            align-items: center;
            background: #1a1a2e;
            padding: 20px;
        }
        
        .auth-card {
            background: #16213e;
            border-radius: 32px;
            padding: 40px 36px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            border: 1px solid #2a3a5e;
        }
        
        .auth-card h2 {
            font-weight: 700;
            font-size: 28px;
            margin-bottom: 8px;
            color: #ffffff;
        }
        
        .auth-card h2 .burger-icon {
            color: #f5a623;
        }
        
        .auth-card p.sub {
            color: #8899bb;
            font-size: 14px;
            margin-bottom: 28px;
        }
        
        .auth-card label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #8899bb;
            margin: 16px 0 6px 4px;
        }
        
        .auth-card input {
            width: 100%;
            padding: 14px 18px;
            background: #0d1b2a;
            border: 1px solid #2a3a5e;
            border-radius: 12px;
            color: #f0f4fa;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }
        
        .auth-card input:focus {
            border-color: #4f8cf7;
            box-shadow: 0 0 0 3px rgba(79, 140, 247, 0.2);
        }
        
        .auth-card .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 28px;
        }
        
        .btn-primary {
            background: #4f8cf7;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: 0.15s;
        }
        
        .btn-primary:hover { background: #3a73e0; transform: scale(0.98); }
        
        .btn-outline {
            background: transparent;
            border: 1px solid #2a3a5e;
            padding: 12px;
            border-radius: 12px;
            font-weight: 500;
            color: #8899bb;
            cursor: pointer;
            transition: 0.15s;
        }
        
        .btn-outline:hover { background: #1a2a4e; border-color: #4f8cf7; }
        
        .auth-error {
            background: #3d1e2a;
            color: #f79cb0;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            margin-top: 16px;
            text-align: center;
            border-left: 3px solid #e4566a;
        }
        
        .auth-success {
            background: #1a3a2a;
            color: #7ddfa0;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            margin-top: 16px;
            text-align: center;
            border-left: 3px solid #4ade80;
        }
        
        #main-screen {
            display: none;
            flex: 1;
            height: 100%;
        }
        
        .messenger-layout {
            display: flex;
            height: 100%;
            width: 100%;
        }
        
        .sidebar {
            width: 320px;
            background: #16213e;
            border-right: 1px solid #2a3a5e;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        
        .sidebar-header {
            padding: 18px 20px;
            border-bottom: 1px solid #2a3a5e;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .sidebar-header h3 {
            font-weight: 700;
            font-size: 20px;
            color: #ffffff;
        }
        
        .sidebar-header h3 i {
            color: #f5a623;
        }
        
        .sidebar-header .user-badge {
            background: #1a2a4e;
            padding: 6px 14px 6px 12px;
            border-radius: 12px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #c8d4e6;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid transparent;
        }
        
        .sidebar-header .user-badge:hover {
            border-color: #4f8cf7;
        }
        
        .sidebar-header .user-badge i { color: #4f8cf7; }
        
        .logout-btn {
            background: none;
            border: none;
            color: #8899bb;
            font-size: 18px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 12px;
            transition: 0.15s;
        }
        
        .logout-btn:hover { background: #1a2a4e; color: #f0f4fa; }
        
        .contact-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 20px;
            cursor: pointer;
            transition: 0.1s;
            border-left: 3px solid transparent;
        }
        
        .contact-item:hover { background: #1a2a4e; }
        .contact-item.active {
            background: #1a2a4e;
            border-left-color: #4f8cf7;
        }
        
        .contact-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #2a3a5e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #b8ccf0;
            text-transform: uppercase;
            font-size: 18px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        
        .contact-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .contact-avatar .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid #16213e;
        }
        
        .contact-avatar .online-dot.online {
            background: #4ade80;
        }
        
        .contact-avatar .online-dot.offline {
            background: #666;
        }
        
        .contact-info {
            flex: 1;
            overflow: hidden;
        }
        
        .contact-name {
            font-weight: 500;
            color: #e8edf5;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 15px;
        }
        
        .contact-name .verified-icon {
            color: #4ade80;
            font-size: 12px;
        }
        
        .contact-lastmsg {
            font-size: 13px;
            color: #8899bb;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .contact-time {
            font-size: 11px;
            color: #667799;
            margin-left: auto;
        }
        
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0d1b2a;
        }
        
        .chat-header {
            padding: 16px 24px;
            background: #16213e;
            border-bottom: 1px solid #2a3a5e;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        
        .chat-header .chat-partner {
            font-weight: 500;
            font-size: 18px;
            color: #eef3fa;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .chat-header .chat-partner .verified-icon {
            color: #4ade80;
            font-size: 14px;
        }
        
        .chat-header .chat-actions {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }
        
        .chat-header .chat-actions button {
            background: none;
            border: none;
            color: #8899bb;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            transition: 0.15s;
            font-size: 14px;
        }
        
        .chat-header .chat-actions button:hover {
            background: #1a2a4e;
            color: #f0f4fa;
        }
        
        .chat-header .typing-status {
            font-size: 12px;
            color: #8899bb;
            margin-left: 12px;
        }
        
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .message {
            max-width: 70%;
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            background: #1a2a4e;
            color: #e3eaf3;
            align-self: flex-start;
            margin-bottom: 2px;
            position: relative;
        }
        
        .message.own {
            background: #4f8cf7;
            color: white;
            align-self: flex-end;
        }
        
        .message .msg-sender {
            font-size: 12px;
            font-weight: 600;
            color: #8899bb;
            margin-bottom: 4px;
        }
        
        .message.own .msg-sender { color: #b6ceff; }
        
        .message .msg-time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 4px;
            text-align: right;
        }
        
        .message .msg-actions {
            position: absolute;
            top: 4px;
            right: 4px;
            display: none;
            gap: 4px;
        }
        
        .message:hover .msg-actions {
            display: flex;
        }
        
        .message .msg-actions button {
            background: rgba(0,0,0,0.5);
            border: none;
            color: #fff;
            border-radius: 6px;
            padding: 2px 6px;
            cursor: pointer;
            font-size: 10px;
        }
        
        .message .msg-actions button:hover {
            background: rgba(0,0,0,0.8);
        }
        
        .chat-input-area {
            padding: 12px 20px 20px 20px;
            background: #0d1b2a;
            border-top: 1px solid #2a3a5e;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .chat-input-area input {
            flex: 1;
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid #2a3a5e;
            background: #16213e;
            color: #f0f4fa;
            font-size: 15px;
            outline: none;
        }
        
        .chat-input-area input:focus { border-color: #4f8cf7; }
        .chat-input-area input:disabled { opacity: 0.5; }
        
        .chat-input-area button {
            background: #4f8cf7;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 12px;
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .chat-input-area button:hover { background: #3a73e0; }
        .chat-input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .empty-chat {
            color: #667799;
            text-align: center;
            margin-top: 60px;
            font-size: 16px;
        }
        
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 12px;
            background: #1a2a4e;
            border-radius: 12px;
            align-self: flex-start;
            margin: 4px 0;
        }
        
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #8899bb;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-8px); opacity: 1; }
        }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #0d1b2a; }
        ::-webkit-scrollbar-thumb { background: #2a3a5e; border-radius: 10px; }
        
        @media (max-width: 650px) {
            .sidebar { width: 200px; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="auth-screen">
            <div class="auth-card">
                <h2>🍔 <span class="burger-icon">Burgergram</span></h2>
                <p class="sub">Вход или регистрация</p>
                <div id="auth-form">
                    <label><i class="fas fa-user"></i> Имя пользователя</label>
                    <input type="text" id="auth-username" placeholder="Введите логин (макс 12 символов)" maxlength="12">
                    <label><i class="fas fa-lock"></i> Пароль</label>
                    <input type="password" id="auth-password" placeholder="Пароль">
                    <div class="actions">
                        <button class="btn-primary" id="login-btn"><i class="fas fa-sign-in-alt"></i> Войти</button>
                        <button class="btn-outline" id="register-btn"><i class="fas fa-user-plus"></i> Зарегистрироваться</button>
                    </div>
                    <div id="auth-message" style="display: none;"></div>
                </div>
            </div>
        </div>

        <div id="main-screen">
            <div class="messenger-layout">
                <div class="sidebar">
                    <div class="sidebar-header">
                        <h3><i class="fas fa-hamburger"></i> Burgergram</h3>
                        <div style="display: flex; align-items: center; gap: 6px;">
                            <span class="user-badge" id="profile-btn">
                                <i class="fas fa-user-circle"></i> <span id="current-username-display"></span>
                            </span>
                            <button class="logout-btn" id="logout-btn"><i class="fas fa-sign-out-alt"></i></button>
                        </div>
                    </div>
                    <div class="contact-list" id="contact-list"></div>
                </div>

                <div class="chat-area">
                    <div class="chat-header">
                        <div class="chat-partner" id="chat-partner-name">Выберите чат</div>
                        <div class="typing-status" id="typing-status"></div>
                        <div class="chat-actions">
                            <button id="clear-chat-btn" title="Очистить чат"><i class="fas fa-trash"></i></button>
                            <button id="delete-chat-btn" title="Удалить чат"><i class="fas fa-times-circle"></i></button>
                        </div>
                    </div>
                    <div class="messages-container" id="messages-container">
                        <div class="empty-chat">🍔 Напишите сообщение</div>
                    </div>
                    <div class="chat-input-area">
                        <input type="text" id="message-input" placeholder="Сообщение..." disabled>
                        <button id="send-message-btn" disabled><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно профиля -->
    <div id="profile-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:1000;justify-content:center;align-items:center;">
        <div style="background:#16213e;border-radius:24px;padding:40px;max-width:400px;width:90%;border:1px solid #2a3a5e;">
            <h3 style="color:#fff;margin-bottom:20px;">Настройки профиля</h3>
            <div style="display:flex;flex-direction:column;gap:16px;">
                <div style="text-align:center;">
                    <div id="profile-avatar-preview" style="width:80px;height:80px;border-radius:50%;background:#2a3a5e;margin:0 auto;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:32px;color:#b8ccf0;">
                        <i class="fas fa-user"></i>
                    </div>
                </div>
                <label style="color:#8899bb;font-size:13px;">URL аватара</label>
                <input type="text" id="profile-avatar-input" placeholder="https://example.com/avatar.jpg" style="width:100%;padding:12px;background:#0d1b2a;border:1px solid #2a3a5e;border-radius:12px;color:#f0f4fa;outline:none;">
                <label style="color:#8899bb;font-size:13px;">Отображаемое имя</label>
                <input type="text" id="profile-display-name" placeholder="Отображаемое имя" style="width:100%;padding:12px;background:#0d1b2a;border:1px solid #2a3a5e;border-radius:12px;color:#f0f4fa;outline:none;">
                <label style="color:#8899bb;font-size:13px;">Имя пользователя (нельзя изменить)</label>
                <input type="text" id="profile-username" disabled style="width:100%;padding:12px;background:#0d1b2a;border:1px solid #2a3a5e;border-radius:12px;color:#667799;outline:none;opacity:0.7;">
                <div style="display:flex;gap:12px;margin-top:12px;">
                    <button id="profile-save-btn" class="btn-primary" style="flex:1;">Сохранить</button>
                    <button id="profile-close-btn" class="btn-outline" style="flex:1;">Закрыть</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // SUPABASE КОНФИГ
        // ============================================
        const SUPABASE_URL = 'https://qdmdkezsmxxihepkcqwc.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_hv8rO0WGe0lCujYEiPT3_A_duaiQ1rP';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ============================================
        // ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
        // ============================================
        let currentUser = null;
        let currentChatUserId = null;
        let allUsers = [];
        let messagesSubscription = null;
        let verifiedInterval = null;
        let onlineInterval = null;
        let typingTimeout = null;
        let isTyping = false;

        // ============================================
        // DOM ЭЛЕМЕНТЫ
        // ============================================
        const authScreen = document.getElementById('auth-screen');
        const mainScreen = document.getElementById('main-screen');
        const authMessage = document.getElementById('auth-message');
        const authUsername = document.getElementById('auth-username');
        const authPassword = document.getElementById('auth-password');
        const loginBtn = document.getElementById('login-btn');
        const registerBtn = document.getElementById('register-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const contactList = document.getElementById('contact-list');
        const chatPartnerName = document.getElementById('chat-partner-name');
        const messagesContainer = document.getElementById('messages-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-message-btn');
        const currentUsernameDisplay = document.getElementById('current-username-display');
        const typingStatus = document.getElementById('typing-status');
        const clearChatBtn = document.getElementById('clear-chat-btn');
        const deleteChatBtn = document.getElementById('delete-chat-btn');
        const profileBtn = document.getElementById('profile-btn');
        const profileModal = document.getElementById('profile-modal');
        const profileAvatarInput = document.getElementById('profile-avatar-input');
        const profileDisplayName = document.getElementById('profile-display-name');
        const profileUsername = document.getElementById('profile-username');
        const profileAvatarPreview = document.getElementById('profile-avatar-preview');
        const profileSaveBtn = document.getElementById('profile-save-btn');
        const profileCloseBtn = document.getElementById('profile-close-btn');

        // ============================================
        // СОХРАНЕНИЕ СОСТОЯНИЯ В LOCALSTORAGE
        // ============================================
        function saveSession(user) {
            if (user) {
                localStorage.setItem('burgergram_session', JSON.stringify(user));
            } else {
                localStorage.removeItem('burgergram_session');
            }
        }

        function loadSession() {
            try {
                const data = localStorage.getItem('burgergram_session');
                return data ? JSON.parse(data) : null;
            } catch {
                return null;
            }
        }

        // ============================================
        // ПОМОЩНИКИ
        // ============================================
        function showMessage(msg, type = 'error') {
            authMessage.style.display = 'block';
            authMessage.className = type === 'error' ? 'auth-error' : 'auth-success';
            authMessage.textContent = msg;
        }

        function hideMessage() {
            authMessage.style.display = 'none';
        }

        // ============================================
        // РЕГИСТРАЦИЯ
        // ============================================
        async function registerUser() {
            const username = authUsername.value.trim();
            const password = authPassword.value.trim();

            if (!username || !password) {
                showMessage('❌ Заполните все поля');
                return;
            }

            if (username.length < 3) {
                showMessage('❌ Имя пользователя минимум 3 символа');
                return;
            }

            if (username.length > 12) {
                showMessage('❌ Имя пользователя максимум 12 символов');
                return;
            }

            if (password.length < 4) {
                showMessage('❌ Пароль минимум 4 символа');
                return;
            }

            hideMessage();

            try {
                const { data: existing } = await supabaseClient
                    .from('users')
                    .select('id')
                    .eq('username', username)
                    .maybeSingle();

                if (existing) {
                    showMessage('❌ Пользователь уже существует');
                    return;
                }

                const { data, error } = await supabaseClient
                    .from('users')
                    .insert([{ 
                        username, 
                        password,
                        display_name: username,
                        verified: false,
                        is_online: true,
                        last_seen: new Date().toISOString()
                    }])
                    .select()
                    .single();

                if (error) {
                    showMessage('❌ Ошибка регистрации: ' + error.message);
                    return;
                }

                showMessage('✅ Регистрация успешна!', 'success');
                setTimeout(() => loginUser(username, password), 1000);

            } catch (error) {
                showMessage('❌ Ошибка: ' + error.message);
            }
        }

        // ============================================
        // ВХОД
        // ============================================
        async function loginUser(username, password) {
            if (!username || !password) {
                showMessage('❌ Введите логин и пароль');
                return;
            }

            hideMessage();

            try {
                const { data, error } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('username', username)
                    .eq('password', password)
                    .maybeSingle();

                if (error || !data) {
                    showMessage('❌ Неверный логин или пароль');
                    return;
                }

                currentUser = data;
                saveSession(data);
                await updateOnlineStatus(true);
                currentUsernameDisplay.textContent = data.display_name || data.username;
                enterMainScreen();

            } catch (error) {
                showMessage('❌ Ошибка: ' + error.message);
            }
        }

        // ============================================
        // ONLINE СТАТУС
        // ============================================
        async function updateOnlineStatus(isOnline) {
            if (!currentUser) return;
            try {
                await supabaseClient
                    .from('users')
                    .update({ 
                        is_online: isOnline,
                        last_seen: new Date().toISOString()
                    })
                    .eq('id', currentUser.id);
            } catch (error) {
                console.error('Ошибка обновления статуса:', error);
            }
        }

        // ============================================
        // ВХОД В ОСНОВНОЙ ИНТЕРФЕЙС
        // ============================================
        function enterMainScreen() {
            authScreen.style.display = 'none';
            mainScreen.style.display = 'flex';
            loadContacts();
            subscribeToMessages();
            startVerifiedMonitoring();
            startOnlineMonitoring();
            messageInput.disabled = false;
            sendBtn.disabled = false;
            
            // Тайпинг индикатор
            messageInput.addEventListener('input', () => {
                if (!isTyping && currentChatUserId) {
                    isTyping = true;
                    // Отправляем статус печатает
                    typingStatus.textContent = 'печатает...';
                    clearTimeout(typingTimeout);
                    typingTimeout = setTimeout(() => {
                        isTyping = false;
                        typingStatus.textContent = '';
                    }, 2000);
                }
            });
        }

        // ============================================
        // ВЫХОД
        // ============================================
        async function logout() {
            await updateOnlineStatus(false);
            if (messagesSubscription) {
                messagesSubscription.unsubscribe();
                messagesSubscription = null;
            }
            if (verifiedInterval) {
                clearInterval(verifiedInterval);
                verifiedInterval = null;
            }
            if (onlineInterval) {
                clearInterval(onlineInterval);
                onlineInterval = null;
            }
            currentUser = null;
            currentChatUserId = null;
            saveSession(null);
            authScreen.style.display = 'flex';
            mainScreen.style.display = 'none';
            contactList.innerHTML = '';
            messagesContainer.innerHTML = '<div class="empty-chat">🍔 Выберите чат</div>';
            chatPartnerName.textContent = 'Выберите чат';
            messageInput.disabled = true;
            sendBtn.disabled = true;
            hideMessage();
        }

        // ============================================
        // МОНИТОРИНГ ONLINE
        // ============================================
        function startOnlineMonitoring() {
            if (onlineInterval) clearInterval(onlineInterval);
            onlineInterval = setInterval(async () => {
                if (!currentUser) return;
                await updateOnlineStatus(true);
            }, 30000);
        }

        // ============================================
        // ЗАГРУЗКА КОНТАКТОВ
        // ============================================
        async function loadContacts() {
            if (!currentUser) return;

            try {
                const { data, error } = await supabaseClient
                    .from('users')
                    .select('*')
                    .neq('id', currentUser.id);

                if (error) throw error;
                allUsers = data || [];
                renderContactList();

            } catch (error) {
                console.error('Ошибка загрузки контактов:', error);
            }
        }

        function renderContactList() {
            contactList.innerHTML = '';
            
            if (allUsers.length === 0) {
                contactList.innerHTML = '<div style="padding:20px;color:#667799;text-align:center;">Нет других пользователей</div>';
                return;
            }

            allUsers.forEach(user => {
                const div = document.createElement('div');
                div.className = 'contact-item';
                if (currentChatUserId === user.id) div.classList.add('active');

                const avatar = document.createElement('div');
                avatar.className = 'contact-avatar';
                if (user.avatar_url) {
                    avatar.innerHTML = `<img src="${user.avatar_url}" alt="${user.username}">`;
                } else {
                    avatar.textContent = (user.display_name || user.username).charAt(0).toUpperCase();
                }
                
                const dot = document.createElement('div');
                dot.className = `online-dot ${user.is_online ? 'online' : 'offline'}`;
                avatar.appendChild(dot);

                const info = document.createElement('div');
                info.className = 'contact-info';

                const name = document.createElement('div');
                name.className = 'contact-name';
                name.textContent = user.display_name || user.username;
                if (user.verified) {
                    const icon = document.createElement('i');
                    icon.className = 'fas fa-check-circle verified-icon';
                    name.appendChild(icon);
                }

                const last = document.createElement('div');
                last.className = 'contact-lastmsg';
                last.textContent = user.is_online ? 'В сети' : 'Был(а) ' + (user.last_seen ? new Date(user.last_seen).toLocaleString() : 'давно');

                info.appendChild(name);
                info.appendChild(last);
                div.appendChild(avatar);
                div.appendChild(info);

                div.addEventListener('click', () => openChat(user.id));
                contactList.appendChild(div);
            });
        }

        // ============================================
        // ОТКРЫТЬ ЧАТ
        // ============================================
        async function openChat(userId) {
            if (!currentUser) return;
            currentChatUserId = userId;
            
            document.querySelectorAll('.contact-item').forEach(el => el.classList.remove('active'));
            const items = document.querySelectorAll('.contact-item');
            items.forEach(item => {
                const name = item.querySelector('.contact-name');
                if (name && name.textContent.trim() === (allUsers.find(u => u.id === userId)?.display_name || allUsers.find(u => u.id === userId)?.username)) {
                    item.classList.add('active');
                }
            });

            const partner = allUsers.find(u => u.id === userId);
            if (partner) {
                chatPartnerName.innerHTML = `
                    ${partner.display_name || partner.username}
                    ${partner.verified ? '<i class="fas fa-check-circle verified-icon" style="color:#4ade80;font-size:14px;"></i>' : ''}
                    <span style="font-size:12px;color:#8899bb;margin-left:8px;">
                        ${partner.is_online ? '🟢' : '⚫'}
                    </span>
                `;
            }
            
            await loadMessages(userId);
            messageInput.disabled = false;
            sendBtn.disabled = false;
            messageInput.focus();
        }

        // ============================================
        // ЗАГРУЗКА СООБЩЕНИЙ
        // ============================================
        async function loadMessages(otherUserId) {
            if (!currentUser || !otherUserId) return;

            try {
                const { data, error } = await supabaseClient
                    .from('messages')
                    .select('*')
                    .or(`and(sender_id.eq.${currentUser.id}, receiver_id.eq.${otherUserId}),and(sender_id.eq.${otherUserId}, receiver_id.eq.${currentUser.id})`)
                    .order('created_at', { ascending: true })
                    .limit(50);

                if (error) throw error;

                messagesContainer.innerHTML = '';
                if (!data || data.length === 0) {
                    messagesContainer.innerHTML = '<div class="empty-chat">🍔 Начните общение</div>';
                    return;
                }

                data.forEach(msg => {
                    if (msg.is_deleted) return;
                    const isOwn = msg.sender_id === currentUser.id;
                    const sender = allUsers.find(u => u.id === msg.sender_id);
                    const senderName = isOwn ? 'Вы' : (sender?.display_name || sender?.username || 'Неизвестный');
                    appendMessage(msg.content, isOwn, senderName, msg.created_at, msg.id);
                });

                messagesContainer.scrollTop = messagesContainer.scrollHeight;

            } catch (error) {
                console.error('Ошибка загрузки сообщений:', error);
            }
        }

        function appendMessage(text, isOwn, senderName, timestamp, msgId) {
            const div = document.createElement('div');
            div.className = `message ${isOwn ? 'own' : ''}`;
            div.dataset.msgId = msgId;
            
            const senderSpan = document.createElement('div');
            senderSpan.className = 'msg-sender';
            senderSpan.textContent = senderName;
            
            const textSpan = document.createElement('div');
            textSpan.textContent = text;
            
            const timeSpan = document.createElement('div');
            timeSpan.className = 'msg-time';
            if (timestamp) {
                const d = new Date(timestamp);
                timeSpan.textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
            
            // Действия над сообщением
            const actions = document.createElement('div');
            actions.className = 'msg-actions';
            if (isOwn) {
                const deleteBtn = document.createElement('button');
                deleteBtn.innerHTML = '<i class="fas fa-trash"></i>';
                deleteBtn.title = 'Удалить';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteMessage(msgId);
                };
                actions.appendChild(deleteBtn);
            }
            
            div.appendChild(senderSpan);
            div.appendChild(textSpan);
            div.appendChild(timeSpan);
            div.appendChild(actions);
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // ============================================
        // УДАЛЕНИЕ СООБЩЕНИЯ
        // ============================================
        async function deleteMessage(msgId) {
            if (!msgId || !currentUser) return;
            if (!confirm('Удалить сообщение?')) return;

            try {
                const { error } = await supabaseClient
                    .from('messages')
                    .update({ is_deleted: true })
                    .eq('id', msgId)
                    .eq('sender_id', currentUser.id);

                if (error) throw error;

                // Удаляем из DOM
                const msgEl = document.querySelector(`[data-msg-id="${msgId}"]`);
                if (msgEl) msgEl.remove();

            } catch (error) {
                console.error('Ошибка удаления:', error);
            }
        }

        // ============================================
        // ОЧИСТКА ЧАТА
        // ============================================
        async function clearChat() {
            if (!currentUser || !currentChatUserId) return;
            if (!confirm('Очистить всю историю чата?')) return;

            try {
                const { error } = await supabaseClient
                    .from('messages')
                    .update({ is_deleted: true })
                    .or(`and(sender_id.eq.${currentUser.id}, receiver_id.eq.${currentChatUserId}),and(sender_id.eq.${currentChatUserId}, receiver_id.eq.${currentUser.id})`);

                if (error) throw error;
                await loadMessages(currentChatUserId);

            } catch (error) {
                console.error('Ошибка очистки:', error);
            }
        }

        // ============================================
        // УДАЛЕНИЕ ЧАТА
        // ============================================
        async function deleteChat() {
            if (!currentUser || !currentChatUserId) return;
            if (!confirm('Удалить весь чат?')) return;

            try {
                const { error } = await supabaseClient
                    .from('messages')
                    .delete()
                    .or(`and(sender_id.eq.${currentUser.id}, receiver_id.eq.${currentChatUserId}),and(sender_id.eq.${currentChatUserId}, receiver_id.eq.${currentUser.id})`);

                if (error) throw error;
                currentChatUserId = null;
                messagesContainer.innerHTML = '<div class="empty-chat">🍔 Чат удален</div>';
                chatPartnerName.textContent = 'Выберите чат';
                document.querySelectorAll('.contact-item').forEach(el => el.classList.remove('active'));

            } catch (error) {
                console.error('Ошибка удаления чата:', error);
            }
        }

        // ============================================
        // ОТПРАВКА СООБЩЕНИЯ
        // ============================================
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !currentUser || !currentChatUserId) return;

            messageInput.value = '';
            messageInput.disabled = true;
            sendBtn.disabled = true;

            try {
                const { data, error } = await supabaseClient
                    .from('messages')
                    .insert([{
                        sender_id: currentUser.id,
                        receiver_id: currentChatUserId,
                        content: text,
                        created_at: new Date().toISOString()
                    }])
                    .select()
                    .single();

                if (error) throw error;
                appendMessage(text, true, 'Вы', data.created_at, data.id);
                messageInput.disabled = false;
                sendBtn.disabled = false;
                messageInput.focus();

            } catch (error) {
                console.error('Ошибка отправки:', error);
                messageInput.value = text;
                messageInput.disabled = false;
                sendBtn.disabled = false;
            }
        }

        // ============================================
        // ПОДПИСКА НА СООБЩЕНИЯ
        // ============================================
        function subscribeToMessages() {
            if (messagesSubscription) {
                messagesSubscription.unsubscribe();
            }

            messagesSubscription = supabaseClient
                .channel('messages-channel')
                .on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'messages'
                }, (payload) => {
                    const newMsg = payload.new;
                    if (newMsg.is_deleted) return;
                    
                    if (currentUser && currentChatUserId) {
                        const isRelevant = 
                            (newMsg.sender_id === currentChatUserId && newMsg.receiver_id === currentUser.id) ||
                            (newMsg.sender_id === currentUser.id && newMsg.receiver_id === currentChatUserId);
                        
                        if (isRelevant && newMsg.sender_id !== currentUser.id) {
                            const sender = allUsers.find(u => u.id === newMsg.sender_id);
                            const senderName = sender?.display_name || sender?.username || 'Собеседник';
                            appendMessage(newMsg.content, false, senderName, newMsg.created_at, newMsg.id);
                        }
                    }
                })
                .subscribe();
        }

        // ============================================
        // МОНИТОРИНГ VERIFIED
        // ============================================
        function startVerifiedMonitoring() {
            if (verifiedInterval) clearInterval(verifiedInterval);
            verifiedInterval = setInterval(async () => {
                if (!currentUser) return;
                try {
                    const { data } = await supabaseClient
                        .from('users')
                        .select('id, username, display_name, avatar_url, verified, is_online, last_seen')
                        .neq('id', currentUser.id);

                    if (data) {
                        allUsers = data;
                        updateContactStatuses();
                    }
                } catch (error) {
                    console.error('Ошибка обновления:', error);
                }
            }, 3000);
        }

        function updateContactStatuses() {
            document.querySelectorAll('.contact-item').forEach(item => {
                const nameEl = item.querySelector('.contact-name');
                if (!nameEl) return;
                
                const username = nameEl.textContent.trim();
                const user = allUsers.find(u => (u.display_name || u.username) === username);
                if (user) {
                    // Обновляем аватар
                    const avatar = item.querySelector('.contact-avatar');
                    if (avatar && user.avatar_url) {
                        avatar.innerHTML = `<img src="${user.avatar_url}" alt="${user.username}"><div class="online-dot ${user.is_online ? 'online' : 'offline'}"></div>`;
                    }
                    
                    // Обновляем статус
                    const lastMsg = item.querySelector('.contact-lastmsg');
                    if (lastMsg) {
                        lastMsg.textContent = user.is_online ? 'В сети' : 'Был(а) ' + (user.last_seen ? new Date(user.last_seen).toLocaleString() : 'давно');
                    }
                    
                    // Обновляем verified
                    const icon = nameEl.querySelector('.verified-icon');
                    if (user.verified && !icon) {
                        const newIcon = document.createElement('i');
                        newIcon.className = 'fas fa-check-circle verified-icon';
                        nameEl.appendChild(newIcon);
                    } else if (!user.verified && icon) {
                        icon.remove();
                    }
                }
            });
        }

        // ============================================
        // ПРОФИЛЬ
        // ============================================
        function openProfile() {
            if (!currentUser) return;
            profileUsername.value = currentUser.username;
            profileDisplayName.value = currentUser.display_name || currentUser.username;
            profileAvatarInput.value = currentUser.avatar_url || '';
            updateProfileAvatarPreview(currentUser.avatar_url);
            profileModal.style.display = 'flex';
        }

        function updateProfileAvatarPreview(url) {
            if (url) {
                profileAvatarPreview.innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover;">`;
            } else {
                profileAvatarPreview.innerHTML = '<i class="fas fa-user"></i>';
            }
        }

        async function saveProfile() {
            if (!currentUser) return;
            const displayName = profileDisplayName.value.trim() || currentUser.username;
            const avatarUrl = profileAvatarInput.value.trim();

            try {
                const { error } = await supabaseClient
                    .from('users')
                    .update({
                        display_name: displayName,
                        avatar_url: avatarUrl || null
                    })
                    .eq('id', currentUser.id);

                if (error) throw error;

                currentUser.display_name = displayName;
                currentUser.avatar_url = avatarUrl;
                currentUsernameDisplay.textContent = displayName;
                saveSession(currentUser);
                updateProfileAvatarPreview(avatarUrl);
                loadContacts();
                profileModal.style.display = 'none';

            } catch (error) {
                console.error('Ошибка сохранения:', error);
                alert('Ошибка сохранения: ' + error.message);
            }
        }

        // ============================================
        // ОБРАБОТЧИКИ СОБЫТИЙ
        // ============================================
        loginBtn.onclick = () => {
            const username = authUsername.value.trim();
            const password = authPassword.value.trim();
            loginUser(username, password);
        };

        registerBtn.onclick = registerUser;
        logoutBtn.onclick = logout;
        sendBtn.onclick = sendMessage;
        messageInput.onkeydown = (e) => { if (e.key === 'Enter') sendMessage(); };
        clearChatBtn.onclick = clearChat;
        deleteChatBtn.onclick = deleteChat;
        profileBtn.onclick = openProfile;
        profileCloseBtn.onclick = () => profileModal.style.display = 'none';
        profileSaveBtn.onclick = saveProfile;
        profileAvatarInput.oninput = () => updateProfileAvatarPreview(profileAvatarInput.value);

        // ============================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================
        window.onload = function() {
            console.log('🍔 Burgergram загружен!');
            
            // Восстановление сессии
            const savedSession = loadSession();
            if (savedSession) {
                currentUser = savedSession;
                currentUsernameDisplay.textContent = currentUser.display_name || currentUser.username;
                enterMainScreen();
                updateOnlineStatus(true);
            }

            // Проверка подключения
            supabaseClient.from('users').select('count').limit(1)
                .then(() => console.log('✅ Подключено к Supabase'))
                .catch(err => console.error('❌ Ошибка подключения:', err));
        };

        // Закрытие модалки по клику вне
        profileModal.onclick = (e) => {
            if (e.target === profileModal) profileModal.style.display = 'none';
        };
    </script>
</body>
</html>
